name: Minify and Deploy

on:
  push:
    branches: [ main ]   # o master, según uses

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          npm install -g html-minifier-terser clean-css-cli terser

      - name: Minify HTML, CSS y JS
        run: |
          # Minificar HTML
          find . -name "*.html" -not -path "./.git/*" -exec html-minifier-terser \
            --collapse-whitespace --remove-comments --minify-css true --minify-js true \
            -o {} {} \;

          # Minificar CSS
          find . -name "*.css" -not -path "./.git/*" -exec cleancss -o {} {} \;

          # Minificar JS
          find . -name "*.js" -not -path "./.git/*" -exec terser {} -o {} -c -m \;

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
