<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>SIMPLEGYM - Panel Principal</title>
		<link rel="icon" type="image/svg+xml" href="./favicon.svg">
		<link rel="stylesheet" href="css/styles.css">
		<script type="module" src="js/index.mjs"></script>
	</head>
	<body>
		<header class="topbar">
			<h1>SIMPLEGYM</h1>
		</header>
		<main class="container">
			<section class="dashboard-container" id="main-section">
				<article class="card">
					<h2>Sesión</h2>
					<p class="card-text" id="info-sesion"></p>
					<a id="btn-ir-sesion" href="index.html" class="btn btn-primary">—</a>
				</article>
				<article class="card">
					<h2>Estadísticas</h2>
					<p class="card-text">Revisa tu evolución histórica.</p>
					<div class="btn-panel">
						<a href="estadisticas-ejercicios.html" class="btn btn-primary">Ejercicios</a>
						<a href="estadisticas-sesiones.html" class="btn btn-primary">Sesiones</a>
						<a href="estadisticas-dias.html" class="btn btn-primary">Días</a>
					</div>
				</article>
				<article class="card">
					<h2>Ejercicios (JSON)</h2>
					<p class="card-text">Importa o exporta tus ejercicios.</p>
					<div class="btn-panel">
						<label for="btn-importar-JSON" class="btn btn-primary file-label">Importar</label>
						<input type="file" id="btn-importar-JSON" accept=".json" aria-label="Importar ejercicios en formato JSON" hidden>
						<button type="button" class="btn btn-primary" id="btn-exportar-JSON">Exportar</button>
					</div>
				</article>
				<article class="card">
					<h2>Historial (CSV)</h2>
					<p class="card-text">Importa o exporta tu historial.</p>
					<div class="btn-panel">
						<label for="btn-importar-CSV" class="btn btn-primary file-label">Importar</label>
						<input
							type="file"
							id="btn-importar-CSV"
							accept=".csv,text/csv"
							aria-label="Importar historial en formato CSV"
							hidden
						>
						<button type="button" class="btn btn-primary" id="btn-exportar-CSV">Exportar</button>
					</div>
				</article>
			</section>
			<section class="dashboard-container">
				<article class="card" id="validacion">
					<h2>Cuenta</h2>
					<p class="card-text" id="usuario"></p>
					<button type="button" class="btn btn-primary" id="btn-validar-google" hidden>Entrar con Google</button>
					<button type="button" class="btn btn-primary" id="btn-validar-microsoft" hidden>Entrar con Microsoft</button>
					<button type="button" class="btn btn-primary" id="btn-cerrar-sesion" hidden>Desconectar</button>
				</article>
			</section>
		</main>
	</body>
</html>
