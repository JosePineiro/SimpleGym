<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>SIMPLEGYM - Días de entrenamiento</title>
		<link rel="icon" type="image/svg+xml" href="./favicon.svg">
		<link rel="stylesheet" href="css/styles.css">
		<script type="module" src="js/estadisticas-dias.mjs"></script>
	</head>
	<body>
		<header class="topbar">
			<h1 id="titulo">SIMPLEGYM · Días de entrenamiento</h1>
			<p class="subtitulo" id="subtitulo"></p>
			<a class="topbar-link" href="index.html">Inicio</a>
		</header>
		<main class="container" id="main-container">
			<section class="card">
				<div class="cal-toolbar">
					<button type="button" class="btn btn-secondary cal-nav" id="btn-mes-anterior" aria-label="Mes anterior">‹</button>
					<h2 class="card-title cal-title" id="cal-titulo">—</h2>
					<button type="button" class="btn btn-secondary cal-nav" id="btn-mes-siguiente" aria-label="Mes siguiente">›</button>
				</div>
				<div class="cal-weekdays">
					<span>L</span>
					<span>M</span>
					<span>X</span>
					<span>J</span>
					<span>V</span>
					<span>S</span>
					<span>D</span>
				</div>
				<div class="cal-grid" id="cal-grid"></div>
			</section>

			<section class="card">
				<ul class="cal-leyenda">
					<li><span class="cal-swatch cal-day--some" aria-hidden="true"></span> Sesión incompleta</li>
					<li><span class="cal-swatch cal-day--all" aria-hidden="true"></span> Sesión completa</li>
					<li><span class="cal-swatch cal-day--best" aria-hidden="true"></span> Sesión completa + progreso (★)</li>
				</ul>
			</section>

			<section class="card">
				<h2>Resumen del mes</h2>
				<dl class="stats">
					<div>
						<dt>Sin entreno</dt>
						<dd id="descanso"></dd>
					</div>
					<div>
						<dt>Parcial</dt>
						<dd id="parcial"></dd>
					</div>
					<div>
						<dt>Completo</dt>
						<dd id="completo"></dd>
					</div>
					<div>
						<dt>Con progreso</dt>
						<dd id="progreso"></dd>
					</div>
				</dl>
			</section>

			<section class="card" id="tarjeta-detalle">
				<h2 id="detalle-titulo">—</h2>
				<p class="card-text" id="detalle-texto"></p>
				<table class="table-wrap">
					<thead>
						<tr>
							<th>Ejercicio</th>
							<th>Peso</th>
							<th>Reps.</th>
							<th>1RM</th>
						</tr>
					</thead>
					<tbody id="detalle-filas"></tbody>
				</table>
			</section>
		</main>
	</body>
</html>
