<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>SIMPLEGYM - Sesión de entrenamiento</title>
		<link rel="icon" type="image/svg+xml" href="./favicon.svg">
		<link rel="stylesheet" href="css/styles.css">
		<script type="module" src="js/sesion.mjs"></script>
	</head>
	<body>
		<header class="topbar">
			<h1 id="titulo">—</h1>
			<p class="subtitulo" id="subtitulo"></p>
			<a class="topbar-link" href="index.html">Inicio</a>
		</header>
		<main class="container">
			<section class="dashboard-container">
				<article class="card">
					<h2 id="descarga-titulo">Sesión de descarga</h2>
					<p class="card-text" id="descarga-aviso"></p>
					<label class="switch">
						<span class="switch-text" id="descarga-estado">Desactivada</span>
						<input type="checkbox" id="toggle-descarga">
						<span class="switch-slider" aria-hidden="true"></span>
					</label>
				</article>
			</section>
			<section class="grid" id="contenedor-ejercicios" aria-label="Ejercicios de la sesión"></section>
		</main>
	</body>
</html>
