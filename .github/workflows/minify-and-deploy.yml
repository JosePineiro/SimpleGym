name: Minify and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          npm install -g html-minifier-terser clean-css-cli terser

      - name: Minify HTML, CSS y JS
        run: |
          # Minificar HTML
          find . -name "*.html" -not -path "./.git/*" -not -path "./node_modules/*" -exec html-minifier-terser \
            --collapse-whitespace --remove-comments --minify-css true --minify-js true \
            -o {} {} \;

          # Minificar CSS
          find . -name "*.css" -not -path "./.git/*" -not -path "./node_modules/*" -exec cleancss -o {} {} \;

          # Minificar JS
          find . -name "*.js" -not -path "./.git/*" -not -path "./node_modules/*" -exec terser {} -o {} -c -m \;
          find . -name "*.mjs" -not -path "./.git/*" -not -path "./node_modules/*" -exec terser {} -o {} -c -m \;

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true          # ayuda a evitar problemas de historial
