<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>SIMPLEGYM - Progreso</title>
		<link rel="stylesheet" href="css/styles.css">

		<!-- Estilos específicos de progreso.html. -->
		<style>
		.chart-wrap {
			position: relative;
			width: 100%;
			height: clamp(240px, 55vw, 420px);
			margin-top: 12px;
		}
		.chart-wrap canvas {
			display: block;
			width: 100%;
			height: 100%;
			margin-top: 0;
		}
		.chart-hint {
			font-size: 0.8rem;
			color: var(--muted-color);
			text-align: center;
			margin: 10px 0 0;
		}
		.chart-actions {
			display: flex;
			justify-content: center;
			gap: 8px;
			margin-top: 12px;
			flex-wrap: wrap;
		}
		.stats-row {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
			gap: 10px;
			margin-top: 14px;
		}
		.stats-row > div {
			background: #f0f3f6;
			border-radius: 10px;
			padding: 10px;
			text-align: center;
		}
		.stats-row span {
			display: block;
			font-size: 0.75rem;
			color: var(--muted-color);
		}
		.stats-row strong {
			display: block;
			margin-top: 4px;
			color: #18202a;
			font-size: 1.05rem;
		}
		</style>
		<!-- Chart.js + plugin de zoom (UMD, exponen window.Chart y window.ChartZoom) -->
		<script
			src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
		></script>
		<script
			src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"
		></script>
		<script type="module" src="js/progreso.mjs"></script>
	</head>
	<body>
		<header class="topbar">
			<h1 id="tituloMaquina">Máquina no especificada</h1>
			<nav aria-label="Navegación principal">
				<a class="topbar-link" href="estadisticas_lista.html">Volver</a>
			</nav>
		</header>

		<main class="container">
			<div class="card" id="cardGrafico">
				<h2>Evolución del peso</h2>
				<p class="card-text" id="resumenMaquina">—</p>

				<div class="chart-wrap">
					<canvas
						id="grafico"
						role="img"
						aria-label="Gráfico de evolución del peso estimado"
					></canvas>
				</div>

				<p class="chart-hint" id="chartHint">
					Rueda del ratón o pinza para hacer zoom · Arrastra para desplazar
				</p>

				<div class="chart-actions" id="chartActions">
					<button type="button" class="btn btn-secondary" id="btnResetZoom">
						Reiniciar zoom
					</button>
				</div>

				<div class="stats-row" id="statsRow"></div>
			</div>
		</main>
	</body>
</html>
