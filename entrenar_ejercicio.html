<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
		<meta name="description" content="Registro de ejercicios y progresión de entrenamiento">
		<title>SIMPLEGYM - Entrenar ejercicio</title>
		<link rel="icon" type="image/svg+xml" href="./favicon.svg">
		<link rel="stylesheet" href="css/styles.css">
		<script type="module" src="js/entrenar_ejercicio.mjs"></script>
	</head>

	<body>
		<header class="topbar">
			<h1 id="titulo">Ejercicio</h1>
			<p class="subtitulo" id="subtitulo"></p>
			<a class="topbar-link" id="enlaceSalir" href="index.html">Volver</a>
		</header>

		<main class="container" id="main-container">
			<section class="card hero">
				<img src="images/placeholder.svg" alt="Máquina de fitness" id="imagenEjercicio" class="exerciseImage">
				<div>
					<p id="descripcionEjercicio"></p>
					<dl class="stats">
						<div>
							<dt>Series de trabajo</dt>
							<dd id="numeroSeriesEjercicio">—</dd>
						</div>
						<div>
							<dt>Rango de repeticiones</dt>
							<dd id="rangoRepeticionesEjercicio">—</dd>
						</div>
						<div>
							<dt>RIR</dt>
							<dd id="rirEjercicio">—</dd>
						</div>
						<div>
							<dt>Descanso</dt>
							<dd id="descansoEjercicio">—</dd>
						</div>
						<div>
							<dt>Repeticiones objetivo</dt>
							<dd id="repeticionesObjetivo">—</dd>
						</div>
						<div>
							<dt>Peso objetivo</dt>
							<dd id="pesoObjetivo">—</dd>
						</div>
					</dl>
				</div>
			</section>
			<section id="tarjetaFinalizar" class="card hidden">
				<form id="formFinalizar" class="finish-form">
					<label>
						Peso utilizado
						<input id="pesoFinal" name="pesoFinal" type="number" min="2.5" step="2.5" inputmode="decimal" required>
					</label>
					<label>
						Repeticiones alcanzadas
						<input
							id="repeticionesFinal"
							name="repeticionesFinal"
							type="number"
							min="1"
							max="50"
							step="1"
							inputmode="numeric"
							required
						>
					</label>
					<button type="submit" id="botonGuardar" class="btn btn-primary">Guardar</button>
				</form>
			</section>
			<button type="button" id="botonSerie" class="btn btn-primary btn-large">—</button>
		</main>
	</body>
</html>
